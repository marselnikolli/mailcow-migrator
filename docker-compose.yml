version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "4300:8000"
    environment:
      - MAILCOW_URL=${MAILCOW_URL}
      - MAILCOW_API_KEY=${MAILCOW_API_KEY}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - SOURCE_IMAP_HOST=${SOURCE_IMAP_HOST}
      - SOURCE_IMAP_PORT=${SOURCE_IMAP_PORT}
      - DEBUG=${DEBUG}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      - redis
    networks:
      - mailcow-network
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4300/api/v1
    ports:
      - "4301:80"
    depends_on:
      - backend
    networks:
      - mailcow-network
    volumes:
      - ./frontend:/app

  redis:
    image: redis:latest
    ports:
      - "4302:6379"
    networks:
      - mailcow-network

networks:
  mailcow-network:
    driver: bridge
