version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "4300:8000"
    environment:
      - MAILCOW_URL=${MAILCOW_URL}
      - MAILCOW_API_KEY=${MAILCOW_API_KEY}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - SOURCE_IMAP_HOST=${SOURCE_IMAP_HOST}
      - SOURCE_IMAP_PORT=${SOURCE_IMAP_PORT}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - DEBUG=False
      - JOB_LOCK_TIMEOUT=${JOB_LOCK_TIMEOUT:-43200}
      - NOTIFY_WEBHOOK_URL=${NOTIFY_WEBHOOK_URL:-}
      - NOTIFY_EMAIL_TO=${NOTIFY_EMAIL_TO:-}
      - NOTIFY_EMAIL_FROM=${NOTIFY_EMAIL_FROM:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-1}
    depends_on:
      - redis
    networks:
      - mailcow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
    environment:
      - MAILCOW_URL=${MAILCOW_URL}
      - MAILCOW_API_KEY=${MAILCOW_API_KEY}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - SOURCE_IMAP_HOST=${SOURCE_IMAP_HOST}
      - SOURCE_IMAP_PORT=${SOURCE_IMAP_PORT}
      - WORKER_MODE=true
      - JOB_LOCK_TIMEOUT=${JOB_LOCK_TIMEOUT:-43200}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-3}
      - NOTIFY_WEBHOOK_URL=${NOTIFY_WEBHOOK_URL:-}
      - NOTIFY_EMAIL_TO=${NOTIFY_EMAIL_TO:-}
      - NOTIFY_EMAIL_FROM=${NOTIFY_EMAIL_FROM:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-1}
    depends_on:
      - redis
    networks:
      - mailcow-network
    restart: unless-stopped
    volumes:
      - ./backend:/app
    command: python -m app.core.worker

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4300/api/v1
    ports:
      - "4301:80"
    depends_on:
      - backend
    networks:
      - mailcow-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "4302:6379"
    networks:
      - mailcow-network
    restart: unless-stopped
    volumes:
      - redis-data:/data

networks:
  mailcow-network:
    driver: bridge

volumes:
  redis-data:
